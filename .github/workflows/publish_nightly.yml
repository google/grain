name: Build and Publish Nightly

on:
  schedule:
    # At 04:00 every day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_tests_with_bazel:
        description: 'Run unit tests with Bazel. Otherwise, run post-wheel pytest smoke tests.'
        required: false
        default: true
        type: boolean

jobs:
  call-workflow:
    uses: ./.github/workflows/build_and_publish_template.yml
    permissions:
      contents: read
      id-token: write
    with:
      pypi_project_url: https://pypi.org/project/grain-nightly
      run_tests_with_bazel: ${{ github.event_name == 'schedule' || inputs.run_tests_with_bazel }}
      is_nightly: true
      is_ci_tests: false
