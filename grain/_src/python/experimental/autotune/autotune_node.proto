syntax = "proto3";

package grain.autotune;

option java_multiple_files = true;
option java_outer_classname = "AutotuneNode";

message AutotuneNodeSnapshot {
  string name = 1;
  double forgetting_factor = 2;

  // RLS Stats
  message RlsStats {
    repeated double estimates = 1;
    repeated double covariance = 2;
    double forgetting_factor = 3;
  }

  // Timing stats
  message TimingStats {
    RlsStats mean_latency = 1;
    RlsStats mean_inactive_time = 2;
    int64 count = 3;
  }
  TimingStats timing_stats = 3;

  // Throughput stats
  message ThroughputStats {
    RlsStats mean_element_size_bytes = 1;
    int64 min_element_size_bytes = 2;
    int64 max_element_size_bytes = 3;
  }
  ThroughputStats throughput_stats = 4;

  // Concurrency stats
  message ConcurrencyStats {
    RlsStats usl_estimator = 1;
    int64 num_observations = 2;
    int64 concurrency_bins_seen = 3;
  }
  ConcurrencyStats concurrency_stats = 11;

  // Inputs are recursive snapshots
  repeated AutotuneNodeSnapshot inputs = 5;

  // Node-specific data
  oneof node_type {
    SourceNodeSnapshot source_node = 6;
    FixedRatioNodeSnapshot fixed_ratio_node = 7;
    UnknownRatioNodeSnapshot unknown_ratio_node = 8;
    AsyncFixedRatioNodeSnapshot async_fixed_ratio_node = 9;
    InterleaveNodeSnapshot interleave_node = 10;
  }
}

message InterleaveNodeSnapshot {
  int32 cycle_length = 1;
}

message SourceNodeSnapshot {
  // SourceNode has no extra fields beyond base AutotuneNode
}

message FixedRatioNodeSnapshot {
  double input_ratio = 1;
}

message UnknownRatioNodeSnapshot {
  double current_ratio = 1;
}

message AsyncFixedRatioNodeSnapshot {
  double input_ratio = 1;
  double concurrency = 2;
  double buffer_size = 3;
}
